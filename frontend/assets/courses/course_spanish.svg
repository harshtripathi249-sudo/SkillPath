<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="950" cy="360" r="240" fill="#10b981" opacity="0.12" filter="blur(60px)"/>
  <circle cx="400" cy="200" r="180" fill="#6366f1" opacity="0.15" filter="blur(50px)"/>
  
  <!-- Dialogue bubbles -->
  <g transform="translate(680, 160)">
    <rect width="360" height="110" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="32" y="55" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700">¡Hola! ¿Cómo estás?</text>
    <text x="32" y="85" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16">FSI Dialogue Drill • Unit 4</text>
  </g>
  <g transform="translate(760, 310)">
    <rect width="380" height="110" rx="24" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="32" y="55" fill="#6ee7b7" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700">Conversational Fluency</text>
    <text x="32" y="85" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16">Audio Drills &amp; Thinking Method</text>
  </g>
  
  <!-- Sound Waveform visualizer -->
  <g transform="translate(180, 480)">
    <rect x="0" y="40" width="12" height="60" rx="6" fill="url(#wave)"/>
    <rect x="24" y="20" width="12" height="100" rx="6" fill="url(#wave)"/>
    <rect x="48" y="0" width="12" height="140" rx="6" fill="url(#wave)"/>
    <rect x="72" y="30" width="12" height="80" rx="6" fill="url(#wave)"/>
    <rect x="96" y="10" width="12" height="120" rx="6" fill="url(#wave)"/>
    <rect x="120" y="50" width="12" height="40" rx="6" fill="url(#wave)"/>
    <rect x="144" y="15" width="12" height="110" rx="6" fill="url(#wave)"/>
    <rect x="168" y="35" width="12" height="70" rx="6" fill="url(#wave)"/>
    <rect x="192" y="5" width="12" height="130" rx="6" fill="url(#wave)"/>
    <rect x="216" y="25" width="12" height="90" rx="6" fill="url(#wave)"/>
  </g>
  
  <!-- Title Badge -->
  <g transform="translate(140, 200)">
    <rect width="440" height="180" rx="24" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    <text x="36" y="65" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="2">LANGUAGE ACCELERATOR</text>
    <text x="36" y="110" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800">FSI Spanish</text>
    <text x="36" y="145" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="18">Fast-Track Situational Mastery</text>
  </g>
</svg>
